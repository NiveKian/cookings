version: "3.9"

# Rede externa compartilhada entre services / mcp / app.
# Deve ser criada manualmente antes do primeiro `docker compose up`:
#   docker network create cookings-network
networks:
  default:
    name: cookings-network
    external: true

volumes:
  cookings_pgdata:

services:
  db:
    image: postgres:16-alpine
    container_name: cookings_db
    restart: unless-stopped
    env_file:
      - ./db/.env
    ports:
      - "5432:5432"
    volumes:
      - cookings_pgdata:/var/lib/postgresql/data
      # Scripts em db/init só são executados pelo Postgres na PRIMEIRA
      # inicialização do volume (quando ele está vazio).
      - ./db/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-cookings}"]
      interval: 5s
      timeout: 5s
      retries: 10

  service_cursos:
    build: ./service_cursos
    container_name: service_cursos
    restart: unless-stopped
    env_file:
      - ./service_cursos/.env
    ports:
      - "3001:3001"
    depends_on:
      db:
        condition: service_healthy

  service_matriculas:
    build: ./service_matriculas
    container_name: service_matriculas
    restart: unless-stopped
    env_file:
      - ./service_matriculas/.env
    ports:
      - "3002:3002"
    depends_on:
      db:
        condition: service_healthy

  service_receitas:
    build: ./service_receitas
    container_name: service_receitas
    restart: unless-stopped
    env_file:
      - ./service_receitas/.env
    ports:
      - "3003:3003"
    depends_on:
      db:
        condition: service_healthy
